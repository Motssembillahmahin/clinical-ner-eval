[project]
name = "clinical-ner-eval"
version = "0.1.0"
description = "Evaluation harness benchmarking shortlisted clinical NER models across multiple datasets"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.44",
    "torch>=2.2",
    "datasets>=2.20,<3.0",
    "bioc>=2.0",
    "seqeval>=1.2.2",
    "evaluate>=0.4",
    "accelerate>=0.33",
    "numpy>=1.26",
    "pandas>=2.2",
    "sentencepiece>=0.1.99",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
